<svg width="120" height="80" viewBox="0 0 120 80" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="120" height="80" fill="#f8f9fa"/>

  <!-- Rectangular room outline -->
  <rect x="15" y="20" width="90" height="40"
        fill="#ffffff"
        stroke="#374151"
        stroke-width="2"/>

  <!-- Grid pattern -->
  <defs>
    <pattern id="grid" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M 10 0 L 0 0 0 10" fill="none" stroke="#e5e7eb" stroke-width="0.5"/>
    </pattern>
  </defs>

  <!-- Apply grid to room interior -->
  <rect x="17" y="22" width="86" height="36" fill="url(#grid)"/>

  <!-- Wall thickness visualization -->
  <rect x="15" y="20" width="90" height="3" fill="#6b7280"/>
  <rect x="15" y="57" width="90" height="3" fill="#6b7280"/>
  <rect x="15" y="20" width="3" height="40" fill="#6b7280"/>
  <rect x="102" y="20" width="3" height="40" fill="#6b7280"/>

  <!-- Dimension indicators -->
  <text x="60" y="15" text-anchor="middle" fill="#6b7280" font-family="Arial, sans-serif" font-size="8">8m</text>
  <text x="10" y="43" text-anchor="middle" fill="#6b7280" font-family="Arial, sans-serif" font-size="8" transform="rotate(-90, 10, 43)">4m</text>
</svg>