<svg width="120" height="80" viewBox="0 0 120 80" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="120" height="80" fill="#f8f9fa"/>

  <!-- Square room outline -->
  <rect x="25" y="15" width="70" height="50"
        fill="#ffffff"
        stroke="#374151"
        stroke-width="2"/>

  <!-- Grid pattern -->
  <defs>
    <pattern id="squareGrid" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M 10 0 L 0 0 0 10" fill="none" stroke="#e5e7eb" stroke-width="0.5"/>
    </pattern>
  </defs>

  <!-- Apply grid to room interior -->
  <rect x="27" y="17" width="66" height="46" fill="url(#squareGrid)"/>

  <!-- Wall thickness visualization -->
  <rect x="25" y="15" width="70" height="3" fill="#6b7280"/>
  <rect x="25" y="62" width="70" height="3" fill="#6b7280"/>
  <rect x="25" y="15" width="3" height="50" fill="#6b7280"/>
  <rect x="92" y="15" width="3" height="50" fill="#6b7280"/>

  <!-- Dimension indicators -->
  <text x="60" y="12" text-anchor="middle" fill="#6b7280" font-family="Arial, sans-serif" font-size="8">5m</text>
  <text x="20" y="43" text-anchor="middle" fill="#6b7280" font-family="Arial, sans-serif" font-size="8" transform="rotate(-90, 20, 43)">5m</text>
</svg>